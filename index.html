
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 서바이벌 레이싱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brutal-shadow: 4px 4px 0px 0px rgba(0,0,0,1);
            --brutal-shadow-hover: 2px 2px 0px 0px rgba(0,0,0,1);
        }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0f172a;
            color: #000;
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1532906315353-ce0248866de6?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            opacity: 0.4;
            z-index: -1;
        }
        .font-racing {
            font-family: 'Orbitron', sans-serif;
        }
        .font-brutal {
            font-family: 'Black Han Sans', sans-serif;
        }
        .brutal-card {
            background: white;
            border: 3px solid black;
            box-shadow: var(--brutal-shadow);
            transition: all 0.1s ease;
        }
        .brutal-btn {
            border: 3px solid black;
            box-shadow: var(--brutal-shadow);
            transition: all 0.1s ease;
            font-weight: 900;
            text-transform: uppercase;
        }
        .brutal-btn:active {
            box-shadow: 0px 0px 0px 0px rgba(0,0,0,1);
            transform: translate(4px, 4px);
        }
        .brutal-input {
            border: 3px solid black;
            padding: 10px;
            font-weight: 700;
        }
        /* Custom scrollbar for brutalism */
        ::-webkit-scrollbar {
            width: 12px;
        }
        ::-webkit-scrollbar-track {
            background: white;
            border-left: 3px solid black;
        }
        ::-webkit-scrollbar-thumb {
            background: black;
            border: 2px solid white;
        }
    </style>
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
